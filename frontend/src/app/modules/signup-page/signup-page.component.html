<div class="page">
	<header class="topbar">
		<img class="topbar-logo" src="/logo.png" alt="MDD" />
	</header>

	<main class="content">
		<a class="back" routerLink="/" aria-label="Retour">←</a>

		<div class="card">
			<img class="hero-logo" src="/logo.png" alt="MDD" />
			<h1>Inscription</h1>

			<form [formGroup]="form" (ngSubmit)="submit()">
				<label>
					Nom d'utilisateur
					<input type="text" formControlName="username" autocomplete="username" />
				</label>

				<label>
					Adresse e-mail
					<input type="email" formControlName="email" autocomplete="email" />
				</label>

				<label>
					Mot de passe
					<input type="password" formControlName="password" autocomplete="new-password" />
				</label>

				<button class="btn-primary" type="submit" [disabled]="form.invalid || submitting">
					S'inscrire
				</button>
			</form>
		</div>
	</main>
</div>
